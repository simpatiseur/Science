
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-CI PRO - Système Ivoirien</title>
    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: #161e2d;
            --accent-primary: #f97316;
            --accent-secondary: #3b82f6;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 20px;
            background: linear-gradient(180deg, #1e293b 0%, var(--bg-color) 100%);
            text-align: center;
            border-bottom: 1px solid #1e293b;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--accent-primary);
        }

        header p {
            margin: 5px 0 0;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        /* Main Content Scrollable Area */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-dim);
            margin: 20px 0 10px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #1e293b;
            margin-left: 10px;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #1e293b;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .card:active {
            transform: scale(0.95);
            background: #1e293b;
        }

        .card i {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .card span {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .card.featured {
            grid-column: span 2;
            border-left: 4px solid var(--accent-primary);
            flex-direction: row;
            justify-content: flex-start;
            gap: 20px;
        }

        /* Bottom Nav */
        nav {
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1e293b;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dim);
            font-size: 0.7rem;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-primary);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        /* Camera Button */
        .fab {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: var(--accent-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(249, 115, 22, 0.4);
            font-size: 24px;
            z-index: 100;
        }

        /* Color classes */
        .blue { color: #3b82f6; }
        .orange { color: #f97316; }
        .green { color: #10b981; }
        .purple { color: #8b5cf6; }

    </style>
</head>
<body>

    <header>
        <h1>SCIENCE CI PRO</h1>
        <p>Programme National • Côte d'Ivoire</p>
    </header>

    <main>
        <div class="section-title">Cycles Scolaires</div>
        <div class="grid">
            <a href="#" class="card">
                <i class="blue">🏫</i>
                <span>1er Cycle</span>
                <small style="color:var(--text-dim); font-size: 0.7rem;">6ème à 3ème</small>
            </a>
            <a href="#" class="card">
                <i class="purple">🎓</i>
                <span>2nd Cycle</span>
                <small style="color:var(--text-dim); font-size: 0.7rem;">2nde à 1ère</small>
            </a>
            <a href="#" class="card featured">
                <i class="orange">🏆</i>
                <div>
                    <span>Terminale D</span><br>
                    <small style="color:var(--text-dim)">Préparation intensive au BAC</small>
                </div>
            </a>
        </div>

        <div class="section-title">Outils Scientifiques</div>
        <div class="grid">
            <div class="card" onclick="alert('Calculatrice en cours de développement...')">
                <i class="green">🧮</i>
                <span>Calculatrice</span>
            </div>
            <div class="card" onclick="alert('Module Grapheur bientôt disponible')">
                <i class="blue">📈</i>
                <span>Grapheur 2D</span>
            </div>
            <div class="card">
                <i class="orange">📝</i>
                <span>Annales</span>
            </div>
            <div class="card">
                <i class="purple">💻</i>
                <span>Info/Python</span>
            </div>
        </div>
    </main>

    <div class="fab" onclick="alert('Scanner IA : Prenez une photo de votre exercice.')">📷</div>

    <nav>
        <div class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Accueil</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">📚</span>
            <span>Cours</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">⭐</span>
            <span>Favoris</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">⚙️</span>
            <span>Réglages</span>
        </div>
    </nav>

    <script>
        // Futur emplacement de la logique JS pour la calculatrice et l'IA
        console.log("S-CI PRO chargée avec succès.");
    </script>
</body>
</html>
