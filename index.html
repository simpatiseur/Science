<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-CI PRO - Système Ivoirien</title>
    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: #161e2d;
            --accent-primary: #f97316;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            padding: 20px;
            background: linear-gradient(180deg, #1e293b 0%, var(--bg-color) 100%);
            text-align: center;
            border-bottom: 1px solid #1e293b;
        }

        main { padding: 20px; }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-dim);
            margin: 20px 0 10px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #1e293b;
            margin-left: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #1e293b;
            cursor: pointer;
        }

        /* Style de la calculatrice */
        #calc-container {
            display: none;
            background: #1e293b;
            padding: 15px;
            border-radius: 20px;
            margin-top: 20px;
            border: 1px solid var(--accent-primary);
        }

        .calc-screen {
            width: 100%;
            height: 50px;
            background: #000;
            color: #0f0;
            text-align: right;
            font-size: 1.5rem;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: none;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            padding: 15px;
            border-radius: 8px;
            border: none;
            background: #334155;
            color: white;
            font-weight: bold;
        }

        .btn-op { background: var(--accent-primary); }
        .btn-equal { background: #10b981; grid-column: span 2; }
    </style>
</head>
<body>

    <header>
        <h1>SCIENCE CI PRO</h1>
        <p>Programme National • Côte d'Ivoire</p>
    </header>

    <main>
        <div class="section-title">Outils Scientifiques</div>
        <div class="grid">
            <div class="card" onclick="toggleCalc()">
                <span style="font-size: 2rem;">🧮</span>
                <span style="margin-top:10px;">Calculatrice</span>
            </div>
            <div class="card">
                <span style="font-size: 2rem;">📈</span>
                <span style="margin-top:10px;">Grapheur</span>
            </div>
        </div>

        <div id="calc-container">
            <input type="text" id="display" class="calc-screen" readonly>
            <div class="btn-grid">
                <button onclick="clearDisplay()" style="background:#ef4444;">C</button>
                <button onclick="addToDisplay('(')">(</button>
                <button onclick="addToDisplay(')')">)</button>
                <button class="btn-op" onclick="addToDisplay('/')">/</button>
                
                <button onclick="addToDisplay('7')">7</button>
                <button onclick="addToDisplay('8')">8</button>
                <button onclick="addToDisplay('9')">9</button>
                <button class="btn-op" onclick="addToDisplay('*')">×</button>
                
                <button onclick="addToDisplay('4')">4</button>
                <button onclick="addToDisplay('5')">5</button>
                <button onclick="addToDisplay('6')">6</button>
                <button class="btn-op" onclick="addToDisplay('-')">-</button>
                
                <button onclick="addToDisplay('1')">1</button>
                <button onclick="addToDisplay('2')">2</button>
                <button onclick="addToDisplay('3')">3</button>
                <button class="btn-op" onclick="addToDisplay('+')">+</button>
                
                <button onclick="addToDisplay('0')">0</button>
                <button onclick="addToDisplay('.')">.</button>
                <button class="btn-equal" onclick="calculate()">=</button>
            </div>
        </div>
    </main>

    <script>
        function toggleCalc() {
            const container = document.getElementById('calc-container');
            container.style.display = (container.style.display === 'block') ? 'none' : 'block';
        }

        function addToDisplay(val) {
            document.getElementById('display').value += val;
        }

        function clearDisplay() {
            document.getElementById('display').value = '';
        }

        function calculate() {
            try {
                const result = eval(document.getElementById('display').value);
                document.getElementById('display').value = result;
            } catch (e) {
                document.getElementById('display').value = 'Erreur';
            }
        }
    </script>
</body>
</html>
