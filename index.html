<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENCE CI PRO</title>
    <style>
        /* === TON STYLE D'ORIGINE EXACT === */
        :root {
            --orange: #ff6600;
            --dark-blue: #0f172a;
            --card-bg: #1e293b; /* Bleu foncé pour les cartes */
            --text-color: white;
        }

        body {
            background-color: var(--dark-blue);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #334155;
        }

        .header h1 {
            color: var(--orange);
            font-size: 1.5rem;
            margin: 0;
        }

        .header span {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* GRILLE D'ACCUEIL */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            margin-top: 10px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .card:active {
            transform: scale(0.97);
        }

        .card-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* PAGE COURS & NAVIGATION */
        .page {
            display: none;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .active-page {
            display: block;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            background-color: var(--dark-blue);
            padding: 10px 0;
            border-top: 1px solid #334155;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        .nav-item {
            text-align: center;
            color: #94a3b8;
            font-size: 0.8rem;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--orange);
        }

        .nav-icon {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SCIENCE CI PRO</h1>
        <span>Réussir son BAC en Côte d'Ivoire</span>
    </div>

    <div id="page-accueil" class="page active-page">
        <div class="grid-container">
            <div class="card" onclick="alert('Bientôt !')">
                <div class="card-icon">🧮</div>
                <div class="card-title">Calculatrice</div>
            </div>
            <div class="card" onclick="alert('Bientôt !')">
                <div class="card-icon">📈</div>
                <div class="card-title">Grapheur Pro</div>
            </div>
        </div>
    </div>

    <div id="page-cours" class="page">
        <h2 style="color:var(--orange);">📚 Cours</h2>
        <p>Les cours de 6ème arriveront ici.</p>
    </div>

    <div id="page-quiz" class="page">
        <h2 style="color:var(--orange);">📝 Quiz</h2>
        <p>Bientôt...</p>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="changerPage('accueil')">
            <span class="nav-icon">🏠</span>Accueil
        </div>
        <div class="nav-item" onclick="changerPage('cours')">
            <span class="nav-icon">📚</span>Cours
        </div>
        <div class="nav-item" onclick="changerPage('quiz')">
            <span class="nav-icon">📝</span>Quiz
        </div>
    </div>

    <script>
        // FONCTION POUR CHANGER DE PAGE
        function changerPage(pageId) {
            // Cacher toutes les pages
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            // Retirer 'active' de tous les boutons de nav
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            // Afficher la page demandée
            document.getElementById('page-' + pageId).classList.add('active-page');
            
            // Activer le bouton correspondant dans la nav
            let index = 0;
            if (pageId === 'accueil') index = 0;
            if (pageId === 'cours') index = 1;
            if (pageId === 'quiz') index = 2;
            document.querySelectorAll('.nav-item')[index].classList.add('active');
        }
    </script>

</body>
</html>
