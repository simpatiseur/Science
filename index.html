<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-CI PRO</title>
    <style>
        :root { --bg: #0b0f1a; --card: #161e2d; --orange: #f97316; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 15px; overflow-x: hidden; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #1e293b; cursor: pointer; transition: 0.3s; }
        .card:active { transform: scale(0.95); background: #1e293b; }
        
        #calc-box, #graph-box { display: none; background: #1e293b; padding: 15px; border-radius: 15px; border: 1px solid var(--orange); margin-bottom: 20px; }
        
        /* Style Calculatrice */
        .screen { width: 100%; height: 60px; background: #000; color: #0f0; text-align: right; font-size: 1.5rem; margin-bottom: 10px; border-radius: 8px; padding: 10px; box-sizing: border-box; border: 2px solid #334155; }
        .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        button { padding: 18px; border-radius: 10px; border: none; background: #334155; color: white; font-weight: bold; font-size: 1.1rem; }
        
        /* Style Grapheur Iframe */
        .iframe-container { width: 100%; height: 500px; border-radius: 10px; overflow: hidden; background: white; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <h2 style="text-align:center; color: var(--orange);">SCIENCE CI PRO</h2>
    <p style="text-align:center; font-size: 0.8rem; margin-top:-10px;">Programme National • Côte d'Ivoire</p>

    <div class="grid">
        <div class="card" onclick="ouvrir('calc-box')">🧮<br>Calculatrice</div>
        <div class="card" onclick="ouvrir('graph-box')">📈<br>Grapheur Pro</div>
    </div>

    <div id="calc-box">
        <input type="text" id="res" class="screen" readonly placeholder="0">
        <div class="btns">
            <button onclick="clearRes()" style="background:#ef4444">C</button>
            <button onclick="add('(')">(</button><button onclick="add(')')">)</button>
            <button onclick="add('/')" style="background:var(--orange)">÷</button>
            <button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button>
            <button onclick="add('*')" style="background:var(--orange)">×</button>
            <button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button>
            <button onclick="add('-')" style="background:var(--orange)">-</button>
            <button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button>
            <button onclick="add('+')" style="background:var(--orange)">+</button>
            <button onclick="add('0')" style="grid-column: span 2;">0</button>
            <button onclick="add('.')">.</button>
            <button onclick="calc()" style="background:#10b981">=</button>
        </div>
    </div>

    <div id="graph-box">
        <div class="iframe-container">
            <iframe src="https://www.desmos.com/calculator?embed" id="desmos-frame"></iframe>
        </div>
        <button onclick="document.getElementById('graph-box').style.display='none'" style="width:100%; margin-top:10px; background:#ef4444;">Fermer le Grapheur</button>
    </div>

    <script>
        function ouvrir(id) {
            document.getElementById('calc-box').style.display = 'none';
            document.getElementById('graph-box').style.display = 'none';
            document.getElementById(id).style.display = 'block';
        }

        function add(v) { document.getElementById('res').value += v; }
        function clearRes() { document.getElementById('res').value = ''; }
        function calc() { 
            try { 
                let v = document.getElementById('res').value;
                document.getElementById('res').value = eval(v); 
            } catch { 
                document.getElementById('res').value = 'Erreur'; 
                setTimeout(clearRes, 1500);
            } 
        }
    </script>
</body>
</html>
