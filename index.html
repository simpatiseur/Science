<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-CI PRO</title>
    <style>
        :root { --bg: #0b0f1a; --card: #161e2d; --orange: #f97316; --blue: #3b82f6; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 15px; padding-bottom: 80px; }
        
        .header { text-align: center; padding: 10px; border-bottom: 1px solid #1e293b; margin-bottom: 20px; }
        .header h2 { color: var(--orange); margin: 0; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #1e293b; cursor: pointer; transition: 0.2s; }
        .card:active { transform: scale(0.95); background: #1e293b; }
        .card i { font-size: 1.5rem; display: block; margin-bottom: 8px; }

        .section { display: none; background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid var(--blue); margin-top: 10px; }
        .active { display: block; }

        /* Navigation du bas */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--orange); z-index: 100; }
        .nav-item { text-align: center; color: #94a3b8; font-size: 0.8rem; cursor: pointer; }
        .nav-item.active-nav { color: var(--orange); font-weight: bold; }

        /* Styles Calculatrice & Grapheur (ton script actuel) */
        .screen { width: 100%; height: 60px; background: #000; color: #0f0; text-align: right; font-size: 1.5rem; margin-bottom: 10px; border-radius: 8px; padding: 10px; box-sizing: border-box; }
        .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        button { padding: 15px; border-radius: 10px; border: none; background: #334155; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h2>SCIENCE CI PRO</h2>
        <span style="font-size: 0.7rem; color: #94a3b8;">Réussir son BAC en Côte d'Ivoire</span>
    </div>

    <div id="page-home" class="page active">
        <div class="grid">
            <div class="card" onclick="ouvrirOutil('calc-box')">🧮<br>Calculatrice</div>
            <div class="card" onclick="ouvrirOutil('graph-box')">📈<br>Grapheur Pro</div>
        </div>

        <div id="calc-box" class="section">
            <input type="text" id="res" class="screen" readonly placeholder="0">
            <div class="btns">
                <button onclick="document.getElementById('res').value=''" style="background:#ef4444">C</button>
                <button onclick="add('(')">(</button><button onclick="add(')')">)</button>
                <button onclick="add('/')" style="background:var(--orange)">÷</button>
                <button onclick="calc()" style="grid-column: span 4; background:#10b981; margin-top:5px;">EGAL (=)</button>
            </div>
        </div>

        <div id="graph-box" class="section">
            <p style="text-align:center; color:gray;">Le grapheur s'affiche ici...</p>
        </div>
    </div>

    <div id="page-cours" class="page" style="display:none;">
        <h3>Mes Matières</h3>
        <div class="grid">
            <div class="card" style="border-color: #22c55e;">🧬<br>SVT</div>
            <div class="card" style="border-color: #eab308;">🌍<br>Hist-Géo</div>
        </div>
        <p style="margin-top:20px; color:#94a3b8;">Sélectionne une matière pour voir les mémos.</p>
    </div>

    <div class="nav-bar">
        <div class="nav-item active-nav" onclick="changerPage('page-home', this)">🏠<br>Accueil</div>
        <div class="nav-item" onclick="changerPage('page-cours', this)">📚<br>Cours</div>
        <div class="nav-item" onclick="alert('Bientôt disponible !')">📝<br>Quiz</div>
    </div>

    <script>
        function changerPage(id, el) {
            // Cacher toutes les pages
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            // Afficher la page sélectionnée
            document.getElementById(id).style.display = 'block';
            // Changer l'icône active
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active-nav'));
            el.classList.add('active-nav');
        }

        function ouvrirOutil(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function add(v) { document.getElementById('res').value += v; }
        function calc() { try { document.getElementById('res').value = eval(document.getElementById('res').value); } catch { document.getElementById('res').value = 'Erreur'; } }
    </script>
</body>
</html>
